[project]
name = "atfield"
version = "0.1.0"
description = "Generate beautiful hexagonal progress widgets for GitHub READMEs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
atfield = "atfield.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
